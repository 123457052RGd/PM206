services:
  api:
    build: .
    container_name: ServerAPI
    ports:
      - "5000:5000"
    # Se cambia "main:app" por "app.main:app"
    command: uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:123456@postgres:5432/DB_miapi

  postgres:
    image: postgres:15
    container_name: ServerBD
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: DB_miapi
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d DB_miapi"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: